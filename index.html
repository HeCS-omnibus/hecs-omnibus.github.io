<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeCS-omnibus</title>
<style>
  :root {
    --bg: #0b0f1a;
    --fg: #e8ecf5;
    --muted: #8b95ab;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  h1 .accent { color: var(--accent); }
  p.tagline {
    margin: 1rem 0 0;
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: var(--muted);
  }
  .rule {
    width: 4rem;
    height: 2px;
    margin: 2rem auto;
    background: var(--accent);
    opacity: 0.6;
  }
  footer {
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <h1>HeCS<span class="accent">-</span>omnibus</h1>
    <p class="tagline">Hectospec Cluster Survey &mdash; omnibus</p>
    <div class="rule"></div>
    <footer>
      Test page &middot;
      <a href="https://github.com/HeCS-omnibus/hecs-omnibus.github.io">GitHub repository</a>
    </footer>
  </main>
</body>
</html>
